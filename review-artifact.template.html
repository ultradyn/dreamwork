<!doctype html>
<!--dreamwork-review-template: v1

Every review artifact the loop ships is BUILT from this file (#325) — it is not
a block to copy. Twelve hand-rolled artifacts carried five font stacks and eight
page backgrounds all meaning "the dark one"; a template a tool fills is the only
mechanism that does not ask each future author to remember.

Its stylesheet is tasks-page.html's, rule for rule, because that is the artifact
the human named as the good one. test_review_artifact.py holds every shared
selector to identical declarations, so a change here has to be deliberate.

HOW IT IS FILLED — review_artifact.py, from a source under .dreamwork/review/src/:

    python3 <skill>/review_artifact.py build .dreamwork/review/src/<slug>.html

  {{name}}            a slot; every one is filled or the build fails loud
  a region            a matched pair of question-mark comment markers around
                      markup that is kept when its slot has content and deleted
                      when it has none. Never write either marker in prose here:
                      an HTML comment ends at the first close-comment sequence,
                      so a literal one inside THIS comment would end it and spill
                      the rest of this text into the page. review_artifact.py
                      refuses to build if that happens; file-formats.md has the
                      exact syntax, which is why it is not repeated here.
  {{TEMPLATE_STAMP}}  derived: v<series>+<8 hex of this file>, so an artifact
                      says which template it was built from and a later
                      edit here makes every older artifact detectably stale

Slots: title identity headline lead body footer are required; context status
tag sub call aside nav skip skip_href aside_label are optional. The format,
in full, is a parsed contract — see file-formats.md.

THE COMPONENT VOCABULARY the body may use, all styled below, so no artifact
needs to invent a second one:

  .label            a section eyebrow            .lead      the opening paragraph
  .call             the recommendation           .notice    a bordered aside
  .facts/.fact      a measured-number row        table      th/td, .pass/.unknown/.fail
  .scroller         wraps a wide table           figure/figcaption + inline <svg>
  .spine/.spine-row a keyed timeline             .stages/.stage  a numbered plan
  .checks/.check    red-then-green pairs         .summary-line   key/value rows
  .deltas/.delta    before/after pairs           .frames/.frame  a drawn UI mock
  .choice/.answer   a decision + its rec         .approval  what approval means
  details/summary   the long tail; its expand transition is transitions.md's
                    idiom, inherited verbatim — do not author a second one
  .quiet .dim .dimmer .read  tone and measure
  code blocks        <pre><code class="language-python">…</code></pre> is
                     tokenised at BUILD time (#339) into tok- spans; supported
                     languages: python json bash javascript html sql. A block
                     with no language-… marker is left plain on purpose — never
                     guessed. sql (#348) is matched case-insensitively, since
                     schema work here writes CREATE TABLE and prose writes select

Offline-clean is a build-time check, not a hope: review_artifact.py refuses to
write output that fetches anything (no external stylesheet, script, image, font
or @import). Links in prose are fine; they are not a load-time fetch.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dreamwork-artifact-style" content="offline-clean; inline-only; watch token palette">
<meta name="dreamwork-review-template" content="{{TEMPLATE_STAMP}}">
<title>{{title}}</title>
<style>
/* Offline-clean by construction: no fetches, no external fonts, no images.
   Tokens are watch.py's, value for value, because this is read inside the
   dashboard's own iframe. */
:root{
  color-scheme:dark;
  --bg:#090d16;--bg2:#0c1220;--panel:#111827;--panel2:#162033;
  --line:#1f2937;--border:#334155;--text:#cbd5e1;--bright:#f4f7fb;
  --lit:#e5e7eb;--muted:#98a3b5;--dim:#697589;--dimmer:#4b5568;
  --accent:#a5b4fc;--accent2:#7dd3fc;--ok:#86efac;--warn:#fcd34d;
  --bad:#fda4af;--ink:#050810;--radius:5px;
  --ease:cubic-bezier(.32,.1,.2,1);--measure:78ch
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--dimmer) transparent}
*::selection{background:rgba(165,180,252,.24);color:var(--bright)}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dimmer);border-radius:4px}
html{background:var(--bg);scroll-padding-top:5.5rem}
body{margin:0;background:
  radial-gradient(ellipse 68rem 34rem at 46% -14rem,rgba(99,102,241,.13),transparent 68%),
  radial-gradient(ellipse 34rem 24rem at 92% 12%,rgba(14,165,233,.045),transparent 70%),
  linear-gradient(180deg,var(--bg),#0a0f19 55%,var(--bg));
  color:var(--text);font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  font-size:.82rem;line-height:1.7;overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{color:var(--bright)}
code{color:var(--lit);background:rgba(22,32,51,.72);padding:.03rem .32ch;border-radius:3px}
pre{margin:.75rem 0;padding:.9rem 1ch;border-left:1px solid var(--border);background:rgba(17,24,39,.52);color:var(--muted);white-space:pre-wrap;overflow:auto;tab-size:2}
/* syntax highlighting tokens (#339) — emitted at build time by
   review_artifact.py as <span class="tok-…"> inside pre>code. No script in
   the artifact; if a rule is ever lost the token takes the block's own
   colour, so highlighting never breaks the code itself. Scoped to pre code
   so an inline <code> snippet is never coloured by accident. */
pre code .tok-kw{color:var(--accent)}
pre code .tok-str{color:var(--ok)}
pre code .tok-num{color:var(--warn)}
pre code .tok-com{color:var(--dimmer);font-style:italic}
pre code .tok-fn{color:var(--accent2)}
pre code .tok-typ{color:var(--warn)}
pre code .tok-dec{color:var(--accent)}
pre code .tok-op{color:var(--muted)}
pre code .tok-tag{color:var(--accent)}
pre code .tok-attr{color:var(--accent2)}
pre code .tok-var{color:inherit}
strong{font-weight:inherit;color:var(--bright)}em{color:var(--lit)}
p{margin:.62rem 0}ul,ol{margin:.55rem 0;padding-left:2.4ch}li{margin:.34rem 0}
h1,h2,h3,h4{margin:0;font:inherit;font-weight:normal;color:var(--bright)}
h1{font-size:1.02rem}h2{font-size:.94rem}h3{color:var(--lit);margin-top:1.4rem}
.wrap{width:min(calc(100% - 2rem),1120px);margin:0 auto}.read{max-width:var(--measure)}
.skip{position:fixed;z-index:99;top:.6rem;left:.6rem;transform:translateY(-180%);display:inline-flex;align-items:center;min-height:44px;padding:.6rem 1ch;background:var(--bright);color:var(--ink);border-radius:var(--radius);text-decoration:none}
.skip:focus{transform:none;transition:transform .35s var(--ease)}
.toprail{position:sticky;top:0;z-index:20;background:rgba(9,13,22,.91);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.toprail-in{width:min(calc(100% - 2rem),1120px);min-height:58px;margin:auto;display:flex;align-items:center;gap:1rem;justify-content:space-between}
.identity{display:flex;align-items:baseline;gap:1ch;min-width:0}.identity b{font-weight:normal;color:var(--bright);white-space:nowrap}.identity span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topactions{display:flex;gap:.35rem;align-items:center}.topactions a{display:inline-flex;align-items:center;min-height:44px;padding:0 .75rem;border:1px solid var(--border);text-decoration:none;border-radius:var(--radius)}
.status{color:var(--warn);white-space:nowrap}.status::before{content:"";display:inline-block;width:5px;height:5px;margin-right:.7ch;border-radius:50%;background:var(--warn);box-shadow:0 0 12px rgba(252,211,77,.55)}
main{padding:3rem 0 5rem}section{margin:0 0 3.4rem}
.label{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:.69rem;margin:0 0 .65rem}
.quiet{color:var(--muted)}.dim{color:var(--dim)}.dimmer{color:var(--dimmer)}
.kicker{display:flex;gap:1ch;align-items:baseline;flex-wrap:wrap}.proposal{color:var(--warn)}
.sub{color:var(--dim);margin:.25rem 0 1.7rem}
.lead{font-size:.9rem;line-height:1.78;color:var(--lit);max-width:76ch}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,.45fr);gap:2.5rem;align-items:end}
/* The one rule this template adds to the artifact it was cut from, and the
   only entry in test_review_artifact.py's TEMPLATE_ONLY: tasks-page.html
   always carries an aside, a template has to render without one. */
.hero-grid.solo{grid-template-columns:minmax(0,1fr)}
.version-mark{border-left:1px solid var(--accent);padding:.2rem 0 .2rem 1.25rem}
.version-mark .big{display:block;color:var(--bright);font-size:2.4rem;line-height:1;letter-spacing:-.07em}
.version-mark small{color:var(--dim)}
.call{margin:1.2rem 0;padding:1rem 1.2ch;background:linear-gradient(90deg,rgba(165,180,252,.09),transparent);border-left:2px solid var(--accent);max-width:84ch}
.notice{margin:1rem 0;padding:.15rem 0 .15rem 1.3ch;border-left:1px solid var(--warn);color:var(--muted);max-width:84ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:1.1rem 0}
.fact{background:var(--bg2);padding:.95rem}.fact .number{display:block;color:var(--bright);font-size:1.3rem;line-height:1.1}.fact .caption{display:block;color:var(--dim);margin-top:.3rem;font-size:.72rem}
table{width:100%;border-collapse:collapse;margin:.7rem 0;font-size:.75rem}
th,td{text-align:left;vertical-align:top;padding:.62rem .72ch;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-size:.66rem;text-transform:uppercase;letter-spacing:.065em;font-weight:normal}
td:first-child{color:var(--lit)}.pass{color:var(--ok)}.unknown{color:var(--warn)}.fail{color:var(--bad)}
.row-accent td{background:rgba(165,180,252,.045)}
.scroller{overflow-x:auto}
.summary-line{display:grid;grid-template-columns:17ch minmax(0,1fr);gap:1.5ch;padding:.5rem 0;border-top:1px solid var(--line)}
.summary-line:last-child{border-bottom:1px solid var(--line)}
.key{color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}
.deltas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.delta{display:grid;grid-template-columns:3.2ch minmax(0,1fr);gap:1ch;padding:.8rem 1rem .8rem 0;border-bottom:1px solid var(--line)}
.delta b{color:var(--accent);font-weight:normal}.delta span{color:var(--muted)}
figure{margin:1rem 0 1.7rem}.figscroll{overflow-x:auto}
svg{display:block;height:auto}svg text{font-family:ui-monospace,"JetBrains Mono",monospace}
figcaption{color:var(--dim);font-size:.72rem;margin-top:.4rem}

/* ── the drawn page ───────────────────────────────────────────────────── */
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem;align-items:start}
.frame{border:1px solid var(--border);background:rgba(9,13,22,.8);min-width:0;box-shadow:0 22px 60px rgba(0,0,0,.19)}
.framebar{display:flex;align-items:center;flex-wrap:wrap;gap:0 1ch;min-height:42px;padding:.35rem 1ch;border-bottom:1px solid var(--line);color:var(--dim);font-size:.72rem}
.framebar b{font-weight:normal;color:var(--lit);white-space:nowrap}
.framebody{padding:.9rem 1.1ch}
.mockhead{display:flex;align-items:center;gap:1ch;margin-bottom:.2rem}
.opener{color:var(--accent)}
.mocktitle{color:var(--bright)}
.crumbs{color:var(--dim);font-size:.72rem;margin-bottom:1rem}
.ctl{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .7rem}
.searchbox{flex:1;min-width:15ch;display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.searchbox span{padding:.3rem .8ch;color:var(--lit)}
.searchbox i{font-style:normal;color:var(--dimmer);padding:.3rem .8ch;margin-left:auto}
.sgroup{display:inline-flex;border:1px solid transparent;gap:.15rem}
.sgbtn{padding:.22rem .7ch;color:var(--dim);border:1px solid transparent;border-radius:var(--radius);white-space:nowrap}
.sgbtn.on{color:var(--lit);border-color:var(--border)}
.countline{color:var(--dim);font-size:.72rem;border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.2rem}
.countline b{color:var(--lit);font-weight:normal}
.tk{display:block;padding:.5rem 0 .52rem;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.tk-1{display:flex;gap:1ch;align-items:baseline}
.tkid{color:var(--dim);font-weight:normal;flex:none}
.tkt{color:var(--text);min-width:0;flex:1}
.tkp{flex:none;color:var(--dim);font-size:.72rem}
.tkp.p01{color:var(--bright)}.tkp.p2{color:var(--text)}.tkp.p3{color:var(--dim)}
.tk-2{display:block;color:var(--dim);font-size:.7rem;padding-left:5.5ch}
.tk.claimed{border-left:2px solid var(--accent);padding-left:.9ch;margin-left:-1.1ch}
.tk.claimed .tkt{color:var(--bright)}
.tk.claimed .tk-2 em{color:var(--accent);font-style:normal}
.tk.blocked .tkt{color:var(--muted)}
.tk.landed .tkt,.tk.landed .tkid{color:var(--dim)}.tk.landed .tk-2{color:var(--dimmer)}
.tk.unknownstate .tkt{color:var(--muted)}
.tk.unknownstate .tk-2 em{color:var(--warn);font-style:normal}
.tk-2 .stale{color:var(--warn);font-style:normal}
.hilite{background:rgba(165,180,252,.16);color:var(--bright)}
.warnline{border-left:2px solid var(--warn);padding:.45rem 0 .45rem 1ch;color:var(--muted);margin:.5rem 0}
.warnline b{color:var(--warn);font-weight:normal}
.calmline{color:var(--dim);padding:.45rem 0}
.detgrid{display:grid;grid-template-columns:13ch minmax(0,1fr);gap:.05rem 1.3ch;font-size:.75rem}
.detgrid dt{color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-size:.66rem;padding-top:.34rem;border-top:1px solid var(--line)}
.detgrid dd{margin:0;color:var(--text);padding-top:.34rem;border-top:1px solid var(--line)}
.detgrid dd em{font-style:normal;color:var(--dim)}
.mockbody{color:var(--muted);font-size:.75rem;margin-top:1rem;border-top:1px solid var(--line);padding-top:.7rem}
.peek{color:var(--dim);font-size:.72rem;border-top:1px solid var(--line);margin-top:.8rem;padding-top:.55rem}
.annot{display:grid;grid-template-columns:3.5ch minmax(0,1fr);gap:.7ch;font-size:.72rem;color:var(--muted);margin:.45rem 0}
.annot b{color:var(--accent2);font-weight:normal}

/* ── prose furniture ──────────────────────────────────────────────────── */
.spine{margin:1.4rem 0}
.spine-row{display:grid;grid-template-columns:15ch 2.4rem minmax(0,1fr);align-items:stretch;min-height:88px}
.spine-key{padding:.85rem 1rem .85rem 0;color:var(--lit);text-align:right}
.spine-rail{position:relative}
.spine-rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)}
.spine-row:first-child .spine-rail::before{top:50%}
.spine-row:last-child .spine-rail::before{bottom:50%}
.spine-dot{position:absolute;z-index:1;left:50%;top:1.15rem;width:9px;height:9px;transform:translateX(-50%);border-radius:50%;background:var(--bg);border:1px solid var(--accent);box-shadow:0 0 0 5px var(--bg)}
.spine-body{padding:.7rem 0 .85rem 1rem;border-top:1px solid var(--line)}
.spine-body p{color:var(--muted);margin:.2rem 0;max-width:var(--measure)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.6rem}
.check{padding:.55rem 0;border-top:1px solid var(--line)}
.check b{font-weight:normal;color:var(--bad)}.check span{color:var(--ok)}
.stages{counter-reset:stage}
.stage{counter-increment:stage;display:grid;grid-template-columns:3.4ch minmax(0,1fr);gap:1ch;padding:.68rem 0;border-top:1px solid var(--line)}
.stage::before{content:counter(stage,decimal-leading-zero);color:var(--accent)}
.stage b{color:var(--lit);font-weight:normal}.stage span{color:var(--muted)}
details{border-top:1px solid var(--line);margin:.65rem 0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;min-height:44px;padding:.6rem 0;color:var(--muted);outline:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--dim);white-space:pre}
details[open]>summary{color:var(--lit);padding-top:1rem}
details[open]>summary::before{content:"\2212 "}
.details-in{padding:0 0 1rem 1.5ch;color:var(--muted)}
details::details-content{block-size:0;opacity:0;filter:blur(3px);overflow:hidden;transition:block-size .72s var(--ease),opacity .45s ease,filter .45s ease;transition-behavior:allow-discrete}
details[open]::details-content{block-size:auto;opacity:1;filter:none}
@starting-style{details[open]::details-content{block-size:0;opacity:0;filter:blur(3px)}}
#decision{scroll-margin-top:4.75rem}
.choice{padding:1rem 0;border-top:1px solid var(--line)}
.choice:last-of-type{border-bottom:1px solid var(--line)}
.choice-grid{display:grid;grid-template-columns:4.5ch minmax(0,1fr);gap:1ch}
.choice-grid>div{max-width:var(--measure)}
.choice-tag{color:var(--accent);font-size:1rem}
.answer{margin-top:.4rem;color:var(--lit)}
.approval{padding:1rem;background:linear-gradient(90deg,rgba(165,180,252,.1),transparent);color:var(--lit);margin-top:1.2rem}
footer{margin-top:3.5rem;padding:1.2rem 0 2rem;border-top:1px solid var(--line);color:var(--dimmer)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
@media(max-width:860px){
  .hero-grid,.frames,.deltas,.checks{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .version-mark{border-left:0;border-top:1px solid var(--line);padding:.7rem 0 0;display:flex;align-items:baseline;gap:1rem}
  .version-mark .big{flex:none;font-size:1.4rem;letter-spacing:-.04em}
  .identity span{display:none}.topactions .full{display:none}
  .spine-row{grid-template-columns:9ch 1.8rem minmax(0,1fr)}.spine-key{font-size:.72rem;padding-right:.4rem}
  .summary-line{grid-template-columns:1fr;gap:.05rem}
  .detgrid{grid-template-columns:1fr}.detgrid dd{border-top:0;padding-top:0}
}
@media(max-width:480px){
  body{font-size:.79rem}.facts{grid-template-columns:1fr}
  .tk-2{padding-left:0}.choice-grid{grid-template-columns:3.4ch minmax(0,1fr)}
  .topactions .status{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;filter:none!important}
  .skip:focus{transition:none}
}
@media print{
  :root{color-scheme:light;--bg:#fff;--bg2:#fff;--panel:#f4f4f5;--panel2:#fff;--line:#bbb;--border:#777;--text:#111;--bright:#000;--lit:#111;--muted:#333;--dim:#444;--dimmer:#555;--accent:#273fa2;--accent2:#075985;--ok:#166534;--warn:#7c4a03;--bad:#991b1b}
  body{background:#fff}.toprail{position:static;background:#fff;backdrop-filter:none}.topactions{display:none}
  .frame{box-shadow:none}details::details-content{block-size:auto;opacity:1;filter:none}
  .frame,.call,.notice,.choice{break-inside:avoid}a{color:#111;text-decoration:none}
}
</style>
</head>
<body>
<!--?skip--><a class="skip" href="{{skip_href}}">{{skip}}</a><!--/?skip-->
<nav class="toprail" aria-label="Artifact navigation">
  <div class="toprail-in">
    <div class="identity"><b>{{identity}}</b><!--?context--><span>{{context}}</span><!--/?context--></div>
    <div class="topactions"><!--?status--><span class="status">{{status}}</span><!--/?status--><!--?nav-->{{nav}}<!--/?nav--></div>
  </div>
</nav>

<main class="wrap" id="top">

<header>
  <div class="hero-grid{{hero_solo}}">
    <div>
      <div class="kicker"><h1>{{headline}}</h1><!--?tag--><span class="proposal">{{tag}}</span><!--/?tag--></div>
      <!--?sub--><div class="sub">{{sub}}</div><!--/?sub-->
      {{lead}}
      <!--?call-->{{call}}<!--/?call-->
    </div>
    <!--?aside--><div class="version-mark" aria-label="{{aside_label}}">
      {{aside}}
    </div><!--/?aside-->
  </div>
</header>

{{body}}

<footer>{{footer}} <span class="dimmer">· built from review template {{TEMPLATE_STAMP}}</span></footer>

</main>
</body>
</html>
